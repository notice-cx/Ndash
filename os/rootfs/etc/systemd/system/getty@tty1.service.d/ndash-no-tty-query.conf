[Service]
# Before agetty starts, systemd (257) resets the console and asks it for its size: it writes an
# ANSI cursor-position query, waits up to 333 ms for the reply, then reads it with a blocking
# read (src/basic/terminal-util.c, terminal_get_size_by_dsr). On this kiosk the boot splash is
# still up then and Plymouth reads the same console for keypresses; when Plymouth takes the
# reply first, the read waits for a key nobody presses and the kiosk never starts. With the
# reset off systemd skips the query. agetty still resets the console itself (DietPi's autologin
# runs it without --noreset).
TTYReset=no
