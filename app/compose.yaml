services:
  ndash:
    build: .
    init: true
    restart: unless-stopped
    ports:
      - '${NDASH_BIND_ADDRESS:-127.0.0.1}:3000:3000'
    environment:
      NDASH_ORIGIN: '${NDASH_ORIGIN:-http://localhost:3000}'
      NDASH_SECURE_COOKIES: '${NDASH_SECURE_COOKIES:-0}'
    volumes:
      - dashboard-data:/data

volumes:
  dashboard-data:
