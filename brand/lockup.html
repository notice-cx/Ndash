<!doctype html>
<!-- The NdashOS lockup: the Notice mark in place of the N, then "dash" in Stack Sans Notch at 600 and
     the suffix lighter in the muted ink. The mark stands on the baseline at 0.95em, above the
     capitals (0.7em), followed by the N's own side bearing (7.5% of the mark's height) and the
     tracking. render.sh fills in @FONT@ (base64 woff2), @SUFFIX@, @SIZE@ (font size in px) and
     @BACKGROUND@. -->
<html><head><meta charset="utf-8"><style>
@font-face { font-family: "Stack Sans Notch"; src: url(data:font/woff2;base64,@FONT@) format("woff2"); font-weight: 100 900; }
html, body { margin: 0; width: 3840px; height: 2160px; background: @BACKGROUND@; }
body { display: flex; align-items: center; justify-content: center; }
.lockup { color: #f0f3ff; white-space: nowrap; line-height: 1.2; font-size: @SIZE@px; font-family: "Stack Sans Notch"; font-weight: 600; letter-spacing: 0.02em; }
.mark { height: 0.95em; width: auto; aspect-ratio: 354 / 394; margin-right: calc(0.95 * 0.075em + 0.02em); }
.suffix { font-weight: 400; color: #a4aec3; }
</style></head><body>
<span class="lockup"><svg viewBox="0 0 354 394" class="mark"><path fill-rule="evenodd" fill="currentColor" d="M0 0H354V394H0ZM100 0H237V137ZM117 137H237V257H117ZM117 257V394H254Z"/></svg>dash<span class="suffix">@SUFFIX@</span></span>
</body></html>
